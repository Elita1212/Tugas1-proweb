<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen</title>
    <link rel="stylesheet" href="format.css">
</head>
<body>
    <form action="8">
        <fieldset>
           <b>Styling Input Form:</b>
        <legend>Form dengan CSS</legend>
        <br><br> 
         <label for="username">Username</label>
        <input type="username" name="username" id="username" />
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" />
        <br><br>
        <label for="textarea">Textarea</label>
        <input type="textarea" name="textarea" id="textarea" />
        <br><br> 
        <label for="radio button">Jenis Kelamin:</label>
        <label for="radio button">
        <input type="radio" name="gender" value="L"> Laki-laki</label>
        <label for="radio button">
        <input type="radio" name="gender" value="P"> Perempuan</label>
        <br><br> 
        <label for="checkbox">Hobi:</label>
        <label for="checkbox">
        <input type="checkbox" name="hobi" value="Gaming"> Gaming</label>
        <label for="checkbox">
        <input type="checkbox" name="hobi" value="Seni"> Seni</label>
        <label for="checkbox">
        <input type="checkbox" name="hobi" value="Olahraga"> Olahraga</label>
        <br><br> 
        <button type="submit">Login</button>
    
    </form>
    </fieldset>
</body>
</html>
