<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aritmatika</title>
     <link rel="stylesheet" href="script.js">
</head>
<body>
    <fieldset>
        <label for="bil1">Input bilangan 1</label>
        <input type="number" name="bilangan1" id="bil1" value="9" />
        <br><br>
        <label for="bil2">Input bilangan 2</label>
        <input type="number" name="bilangan2" id="bil2" value="3" />
        <br><br>
        <button type="button" onclick="hitung('+')">+</button>
         <button type="button" onclick="hitung('-')">-</button>
          <button type="button" onclick="hitung('x')">x</button>
           <button type="button" onclick="hitung('/')">/</button>
        <br><br>
        <label for="hasil">Output</label>
        <input type="hasil" name="hasil" id="hasil" />
    </fieldset>

    <script src="script.js"></script>
</body>
</html>
